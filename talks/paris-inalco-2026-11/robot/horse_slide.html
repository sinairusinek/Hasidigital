<!doctype html>
<html><head><meta charset="utf-8">
<title>Shivhei ha-Besht 11 — the stolen horse</title>
<style>
  html,body{margin:0;background:#F3EDE1}
  .slide{width:1600px;height:900px;position:relative;background:#F3EDE1;overflow:hidden;
         font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Hoefler Text",Georgia,serif}
  /* Four wordless woodcut panels (h*_b_crop.png, squared) in one joint 2x2 grid.
     The cells sit on a cream ground and the ink rules are drawn as borders on each
     cell, so the four read as one comic page. The panels keep multiply so their own
     plate paper melts into the slide's cream -- hence a CREAM grid ground, never a
     dark one, which would multiply the artwork down to black. */
  .grid{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
        display:grid;grid-template-columns:repeat(2,418px);grid-template-rows:repeat(2,418px);
        gap:14px;background:#F3EDE1}
  .cell{width:418px;height:418px;border:2.5px solid #2A2520;overflow:hidden;background:#F3EDE1}
  .cell img{display:block;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
</style></head><body>
<div class="slide">
  <div class="grid">
    <div class="cell"><img src="h1_b_crop.png" alt="A hooded thief hurries the horse out of the stable at night"></div>
    <div class="cell"><img src="h2_b_crop.png" alt="A cryptic word flies from the Besht's mouth; both men are astonished"></div>
    <div class="cell"><img src="h3_b_crop.png" alt="The brother-in-law jeers at him in the street as the townsfolk laugh"></div>
    <div class="cell"><img src="h4_b_crop.png" alt="The horse's head comes in at the window; it and the Besht beam at each other"></div>
  </div>
</div>
</body></html>
